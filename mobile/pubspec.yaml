name: agri_pos
description: نظام المتجر الزراعي - يعمل بدون إنترنت
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Network & API
  http: ^1.2.2
  connectivity_plus: ^6.1.4
  dio: ^5.7.0

  # Auth & Security
  flutter_secure_storage: ^9.2.4

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  pull_to_refresh_flutter3: ^2.0.2
  shimmer: ^3.0.0
  badges: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.5.0
  share_plus: ^10.1.4
  package_info_plus: ^8.1.3
  url_launcher: ^6.3.1
  vibration: ^2.0.0

  # Barcode & QR
  mobile_scanner: ^6.0.6
  qr_flutter: ^4.1.0

  # PDF & Printing
  pdf: ^3.11.3
  printing: ^5.13.4

  # Notifications
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
